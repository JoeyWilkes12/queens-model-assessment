name: Validate local-model assessment

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'index.html'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # The locked Playwright release ships Chromium dependencies for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked website dependencies
        run: npm ci
      - name: Test local assessment grading and accounting
        run: npm run ollama:test
      - name: Audit complete saved receipts without inference
        run: npm run ollama:verify
      - name: Check the leaderboard and board receipts against saved evidence
        run: npm run boards:verify
      - name: Check public evidence boundary
        run: npm run evidence:check-public
      - name: Verify the frozen writing arena and render its Markdown
        run: |
          python3 -B scripts/ollama/import_writing_arena.py --verify --require-complete
          npm run test:writing-arena
      - name: Verify changelog against main history
        run: npm run changelog:verify
      - name: Build static site
        run: npm run build
      - name: Check the performance budget (entry JavaScript)
        run: npm run budget:check
      - name: Install Chromium for rendered site checks
        run: npx playwright install --with-deps chromium
      - name: Check rendered site behavior
        run: npm run site:test
